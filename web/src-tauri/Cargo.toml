[package]
name = "pd_secure_masking"
version = "0.0.0"
description = "A Tauri App"
authors = ["DAI-YULIN-Trendo <yulindai@trendo.co.jp>"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
